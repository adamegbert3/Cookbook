<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Households | Admin</title>
    <link rel="stylesheet" href="../styles/recipes.css">
    <link rel="stylesheet" href="../styles/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../offline_features/manifest.json">
    <script>
        const settings = JSON.parse(localStorage.getItem('userSettings'));
        if (settings) {
            const html = document.documentElement;
            if (settings.theme === 'dark') html.setAttribute('data-theme', 'dark');
            const legacySizeMap = { normal: 16, large: 18, xlarge: 20 };
            const fontPx = typeof settings.fontSize === 'number' ? settings.fontSize : (legacySizeMap[settings.fontSize] || 16);
            html.style.setProperty('--base-size', fontPx + 'px');
            html.setAttribute('data-font', settings.fontStyle || 'inter');
        }
    </script>
</head>
<body>

<div class="admin-container">
    <a href="../admin.html" class="admin-back-link">← Admin Home</a>
    <h1 style="color: #0e7490;">🏠 Households</h1>
    <p style="font-size: 13px; color: var(--primary); opacity: 0.7;">
        People in a household share one weekly menu and shopping list. They can set this up
        themselves in Settings with a join code — this is here for anyone who'd rather you just did it for them.
    </p>
    <div style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
        <input type="text" id="new-household-name" placeholder="New household name (e.g. The Wheelers)" style="flex: 1; min-width: 200px; padding: 8px; border: 1px solid #ddd; border-radius: 6px;">
        <button onclick="adminCreateHousehold()" style="background: #0891b2; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;">Create</button>
    </div>
    <div id="admin-households-list" style="margin-top: 15px;"></div>
</div>

<script type="module" src="../scripts/dashboard.js?v=5"></script>
</body>
</html>
