<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Master Recipe List | Admin</title>
    <link rel="stylesheet" href="../styles/recipes.css">
    <link rel="stylesheet" href="../styles/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
    <link rel="manifest" href="../offline_features/manifest.json">
    <script>
        const settings = JSON.parse(localStorage.getItem('userSettings'));
        if (settings) {
            const html = document.documentElement;
            if (settings.theme === 'dark') html.setAttribute('data-theme', 'dark');
            const legacySizeMap = { normal: 16, large: 18, xlarge: 20 };
            const fontPx = typeof settings.fontSize === 'number' ? settings.fontSize : (legacySizeMap[settings.fontSize] || 16);
            html.style.setProperty('--base-size', fontPx + 'px');
            html.setAttribute('data-font', settings.fontStyle || 'inter');
        }
    </script>
</head>
<body>

<div class="admin-container">
    <a href="../admin.html" class="admin-back-link">← Admin Home</a>
    <h1 style="color: #1e3a8a;">🎛️ Master Recipe List</h1>

    <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;">
        <a href="../review.html" style="background: #7c3aed; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center;">📋 Review Recipes</a>
        <button id="btn-sync" onclick="syncViewCounts()" style="background: var(--bg-card); border: 1px solid var(--border); color: var(--primary); padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;">🔄 Sync Counts</button>
        <button onclick="openStatsModal()" style="background: #8b5cf6; border: none; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">📊 Recipe Counts by Category</button>
        <button onclick="generateMegaIndex()" style="background: #10b981; border: none; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">🌐 Update Homepage Index</button>
        <button onclick="exportRecipes()" style="background: #8b5cf6; border: none; color: white; padding: 5px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold;">💾 Backup Recipes</button>
    </div>

    <!-- Keep this list in sync with submit.html's #category, edit-recipe.html's
         #e-category, SCAN_CATEGORIES in scripts/dashboard.js, and the folder
         buttons in homepage.html. -->
    <div id="admin-filters" style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 15px;">
        <button onclick="filterAdmin('All')" class="pill-btn btn-dark" style="padding: 4px 10px; font-size: 11px;">All</button>
        <button onclick="filterAdmin('Appetizers')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Appetizers</button>
        <button onclick="filterAdmin('Beverages')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Beverages</button>
        <button onclick="filterAdmin('Breads')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Breads</button>
        <button onclick="filterAdmin('Breakfast')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Breakfast</button>
        <button onclick="filterAdmin('Desserts')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Desserts</button>
        <button onclick="filterAdmin('Dutch')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Dutch Oven</button>
        <button onclick="filterAdmin('Main')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Mains</button>
        <button onclick="filterAdmin('Misc')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Misc</button>
        <button onclick="filterAdmin('Sauces')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Sauces</button>
        <button onclick="filterAdmin('Sides')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Sides & Veggies</button>
        <button onclick="filterAdmin('Soups')" class="pill-btn btn-slate" style="padding: 4px 10px; font-size: 11px;">Soups</button>
    </div>

    <input type="text" id="manager-search" placeholder="🔍 Search recipes..." style="width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;">

    <div id="unified-list" style="overflow-x: auto;">
        <p>Loading list...</p>
    </div>

    <div id="stats-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: var(--bg-card); padding: 25px; border-radius: 8px; width: 400px; max-width: 90%;">
            <h2 style="margin: 0 0 5px 0;">📊 Recipe Counts by Category</h2>
            <p id="stats-total-count" style="margin: 0 0 15px 0; color: #6b7280; font-size: 13px;"></p>
            <div id="category-stats-list"></div>
            <button onclick="closeStatsModal()" style="margin-top:20px; width:100%; padding:10px;">Close</button>
        </div>
    </div>
</div>

<script type="module" src="../scripts/dashboard.js?v=5"></script>
</body>
</html>
