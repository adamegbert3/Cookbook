<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Suggested Fixes | Admin</title>
    <link rel="stylesheet" href="styles/recipes.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="offline_features/manifest.json">
    <script>
        const settings = JSON.parse(localStorage.getItem('userSettings'));
        if (settings) {
            const html = document.documentElement;
            if (settings.theme === 'dark') html.setAttribute('data-theme', 'dark');
            const legacySizeMap = { normal: 16, large: 18, xlarge: 20 };
            const fontPx = typeof settings.fontSize === 'number' ? settings.fontSize : (legacySizeMap[settings.fontSize] || 16);
            html.style.setProperty('--base-size', fontPx + 'px');
            html.setAttribute('data-font', settings.fontStyle || 'inter');
        }
    </script>
</head>
<body>

<div class="admin-container">
    <a href="admin.html" class="admin-back-link">← Admin Home</a>
    <h1 style="color: #b45309;">📬 Suggested Fixes</h1>
    <p style="font-size: 13px; color: var(--primary); opacity: 0.7;">
        Corrections family members proposed from the recipe page. Applying one overwrites
        the shared recipe (the previous version is kept in its history).
    </p>
    <div id="suggestions-list" style="margin-top: 10px;">
        <p style="color:#9ca3af; font-size: 13px;">Loading…</p>
    </div>
</div>

<script type="module" src="scripts/dashboard.js?v=5"></script>
</body>
</html>
