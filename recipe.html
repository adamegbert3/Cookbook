<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe View</title>
    <link rel="stylesheet" href="styles/recipes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header-container">
        <div class="logo-area">
            <img src="images/logo.jpg" alt="Book Icon" class="logo-img">
            <h1 class="header-title">Welcome to the Cookbook!</h1>
        </div>
        <div class="header-actions">
            <a href="homepage.html">
                <button class="pill-btn btn-slate">← Back</button>
            </a>
        </div>
    </header>

    <main style="max-width: 800px; margin: 30px auto; padding: 0 20px;">
        
        <div id="recipe"></div>

        <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-top: 40px; text-align: center; border: 1px solid #e2e8f0;">
            <h3 style="margin-top: 0;">Kitchen Tools</h3>
            <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 10px;">
                <button onclick="saveRecipeOffline()" class="pill-btn btn-teal">📡 Save Offline</button>
                <button id="cookModeBtn" onclick="toggleCookMode()" class="pill-btn btn-orange">Enable Cook Mode 🍳</button>
                <button onclick="addToMealPlan()" class="pill-btn btn-blue">📅 Add to Menu</button>
            </div>
            <div style="margin-top: 15px;">
                <button onclick="resizeText(2)" class="pill-btn btn-slate" style="font-size: 0.7rem;">Make Text Bigger +</button>
                <button onclick="resizeText(-2)" class="pill-btn btn-slate" style="font-size: 0.7rem;">Make Text Smaller -</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button onclick="recordCook()" style="background: #fde047; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">
                🎉 I Made This!
            </button>
            <p id="cook-counter" style="font-size: 0.9rem; color: #64748b; margin-top: 10px;">Loading stats...</p>
        </div>

        <div style="margin-top: 40px;">
            <h3>👨‍🍳 Chef's Notes</h3>
            <textarea id="chefNotes" placeholder="Private notes..." style="width: 100%; height: 100px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;"></textarea>
            <button onclick="saveNote()" class="pill-btn btn-teal" style="margin-top: 10px;">Save Note</button>
            <span id="saveStatus" style="color: #10b981; margin-left: 10px;"></span>
        </div>

        <div class="comments-section" style="margin-top: 50px;">
            <h3>💬 Family Discussion</h3>
            <div id="commentsList" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;">
                <p>Loading comments...</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="commentInput" placeholder="How was it?" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
                <button onclick="postComment()" class="pill-btn btn-blue">Post</button>
            </div>
        </div>
    </main>

    <div id="plannerModal" class="modal hidden">
        <div class="modal-content" style="text-align: center;">
            <h3>📅 Add to Menu</h3>
            <p>Pick a day:</p>
            <select id="daySelect" style="width: 100%; padding: 10px; margin-bottom: 20px;">
                <option value="Mon">Monday</option>
                <option value="Tue">Tuesday</option>
                <option value="Wed">Wednesday</option>
                <option value="Thu">Thursday</option>
                <option value="Fri">Friday</option>
                <option value="Sat">Saturday</option>
                <option value="Sun">Sunday</option>
            </select>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="confirmAddToPlan()" class="pill-btn btn-teal">Save</button>
                <button onclick="closePlannerModal()" class="pill-btn btn-slate">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="scripts/recipePage.js"></script>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
