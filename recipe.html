  <h4>Tools:</h4>
  <button id="cookModeBtn" type="button">
  Enable Cook Mode 🍳
  </button>
  <script type="module" src="./scripts/recipePage.js"></script>
  <script>
        // Select the button from the HTML above
        const btn = document.getElementById('cookModeBtn');
        
        // Variable to store the "lock"
        let wakeLock = null;

        // Function to turn Cook Mode ON
        async function turnOn() {
            try {
                // Ask browser for the lock
                wakeLock = await navigator.wakeLock.request('screen');
                
                // Change button look to Green
                btn.classList.add('active');
                btn.textContent = 'Cook Mode IS ON 🍳';
                
            } catch (err) {
                // If it fails (usually because it's not HTTPS or localhost)
                alert("Cook Mode failed. Are you using Live Server?");
                console.error(err);
            }
        }

        // Function to turn Cook Mode OFF
        function turnOff() {
            if (wakeLock) {
                wakeLock.release();
                wakeLock = null;
            }
            // Change button look back to Gray
            btn.classList.remove('active');
            btn.textContent = 'Enable Cook Mode 🍳';
        }
        // When the button is clicked...
        btn.addEventListener('click', () => {
            // If lock is null (off), turn it on. Otherwise, turn it off.
            if (wakeLock === null) {
                turnOn();
            } else {
                turnOff();
            }
        });
    </script>
    <button id="voice-btn" onclick="toggleVoiceControl()">🎙️ Voice: OFF</button>

<style>
  #voice-btn {
    position: fixed; /* Sticks to the screen */
    bottom: 20px;
    right: 20px;
    z-index: 1000; /* Stays on top of images */
    padding: 15px 20px;
    border-radius: 50px;
    border: none;
    background-color: #333; /* Dark gray */
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: background-color 0.3s;
  }
  
  /* This style is for when it is listening */
  #voice-btn.listening {
  background-color: #2ecc71; /* Now it's Green! */
  animation: pulse 1.5s infinite; 
}

  /* Cool pulsing animation */
  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  
</style>
</body>
<script>
  // 1. Setup the Voice Recognition Tool
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  let recognition;
  let isListening = false;
  
  // CHANGED NAME: We use 'voiceBtn' instead of 'btn' to avoid conflicts
  const voiceBtn = document.getElementById('voice-btn');

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = true; 
    recognition.lang = 'en-US';    

    recognition.onresult = function(event) {
      const current = event.resultIndex;
      const transcript = event.results[current][0].transcript.toLowerCase().trim();
      
      console.log("I heard: " + transcript);

      if (transcript.includes('scroll down') || transcript.includes('down')) {
        window.scrollBy({ top: 500, behavior: 'smooth' });
      }
      else if (transcript.includes('scroll up') || transcript.includes('up')) {
        window.scrollBy({ top: -500, behavior: 'smooth' });
      }
      else if (transcript.includes('stop') || transcript.includes('off')) {
        toggleVoiceControl(); 
      }
    };

    recognition.onerror = function(event) {
      if(event.error === 'not-allowed') {
        alert("Please allow Microphone access!");
        toggleVoiceControl(); 
      }
    };
  } else {
    // If browser doesn't support it
    if(voiceBtn) voiceBtn.style.display = 'none';
  }

  function toggleVoiceControl() {
    if (!SpeechRecognition) {
      alert("Browser doesn't support Voice Control.");
      return;
    }

    if (isListening) {
      // Turn OFF
      recognition.stop();
      isListening = false;
      // UPDATED NAME HERE
      voiceBtn.innerText = "🎙️ Voice: OFF";
      voiceBtn.classList.remove('listening'); 
    } else {
      // Turn ON
      recognition.start();
      isListening = true;
      // UPDATED NAME HERE
      voiceBtn.innerText = "🔴 Listening...";
      voiceBtn.classList.add('listening'); 
    }
  }
</script>
