<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Speed Upload Station | Admin</title>
    <link rel="stylesheet" href="styles/recipes.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="offline_features/manifest.json">
    <script>
        const settings = JSON.parse(localStorage.getItem('userSettings'));
        if (settings) {
            const html = document.documentElement;
            if (settings.theme === 'dark') html.setAttribute('data-theme', 'dark');
            const legacySizeMap = { normal: 16, large: 18, xlarge: 20 };
            const fontPx = typeof settings.fontSize === 'number' ? settings.fontSize : (legacySizeMap[settings.fontSize] || 16);
            html.style.setProperty('--base-size', fontPx + 'px');
            html.setAttribute('data-font', settings.fontStyle || 'inter');
        }
    </script>
</head>
<body>

<div class="admin-container">
    <a href="admin.html" class="admin-back-link">← Admin Home</a>
    <h1 style="color: #0a4d74;">🚀 Speed Upload Station</h1>
    <p style="font-size: 13px; color: var(--primary); opacity: 0.7;">Paste an array of recipes in this exact shape — it's the same shape Scan Photos and Import from Link produce, and they'll land here automatically.</p>
    <textarea id="bulk-input" rows="12" placeholder='[
  {
    "name": "Mom&#39;s Spaghetti",
    "author": "Mom",
    "tags": ["Main Dishes"],
    "ingredients": ["1 lb ground beef", "1 jar marinara sauce", "1 lb spaghetti noodles"],
    "instructions": ["Brown the beef.", "Add sauce and simmer 10 min.", "Boil noodles and combine."],
    "notes": "Great with garlic bread."
  }
]' style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: monospace; font-size: 16px; box-sizing: border-box;"></textarea>
    <label style="display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; color:#9a3412; cursor:pointer;">
        <input type="checkbox" id="bulk-upload-as-draft" style="width:18px; height:18px; margin:0;">
        🍳 Add to my Testing Kitchen instead of publishing live (only you can see it until you release it)
    </label>
    <button onclick="uploadBulkRecipes()" style="background: #0a4d74; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: bold; width: 100%;">🚀 Launch Recipes</button>
</div>

<script type="module" src="scripts/dashboard.js?v=5"></script>
</body>
</html>
