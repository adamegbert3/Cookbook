<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Recipes">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Recipes">
    <meta property="og:image" content="images/recipe-book.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookbook</title>
    <meta name="description" content="Recipes">
    <link rel="stylesheet" href="styles/recipes.css">
    <script src="scripts/main.js" type="module" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person_apron" />
</head>
<body>
    <div id="header">
    <header class="header-container">
    <!-- 1. LEFT - COOKBOOK ICON -->
     <img src="images/recipe-book.png" alt="recipe book image" id="recipe-book-img">

    <!-- 2. CENTER - MAIN TITLE -->
    <h1 class="header-title">
        Welcome to the Cookbook!
    </h1>
    
    <!-- This element is needed to push the profile link to the right -->
    <div class="spacer"></div>

    <!-- 3. RIGHT - PROFILE ICON -->
    <a href="index.html" class="profile-link" aria-label="Profile">
        <span class="material-symbols-outlined">
          person_apron
        </span>
    </a>
    </header>
    <h3>Please search for a recipe or click on a category below.</h3>
    <main>
        <form id = "search-form" action="">
            <input type="text" name="searchbar" id="searchbar" placeholder="Find a recipe">
            <button><img src="images/search.svg" alt="searchbutton" id="buttonimg" width="30px"></button>
        </form>
                <div class="folders">
            <button>
                Appetizers & Snacks
            </button>
            <button>
                Breakfast
            </button>
            <button>
                Desserts
            </button>
            <button>
                Main Dishes
            </button>
            <button>
                Miscellaneous
            </button>
            <button>
                Sauces, Dressings & Marinades
            </button>
            <button>
                Sides, Veggies & Breads
            </button>
            <button>
                Soups & Salads
            </button>
        </div>
        <div id="recent-recipes-box" style="border: 1px solid #ccc; padding: 10px; background: #eee;">
  <h3>🕰️ Last Recipe Used:</h3>
  <ul id="history-list">
    </ul>
</div>

<script>
  const list = document.getElementById('history-list');
  const history = JSON.parse(localStorage.getItem('recipeHistory')) || [];

  if (history.length === 0) {
    list.innerHTML = "<li>No recent recipes found.</li>";
  } else {
    history.forEach(item => {
      // Create a link for each item
      list.innerHTML += `<li><a href="${item.url}">${item.title}</a></li>`;
    });
  }
</script>
        <div id ="recipes">    
        </div>
        <p id = "notsigned">
            Please sign in to access the digital cookbook.
        </p>
    </main>
<footer>
</footer>
</body>
</html>
