<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="Recipes">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Recipes">
    <meta property="og:image" content="images/recipe-book.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookbook</title>
    <meta name="description" content="Recipes">
    <link rel="stylesheet" href="styles/recipes.css">
    <script src="scripts/main.js" type="module" defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=person_apron" />
</head>
<body>
    <div id="header">
    <header class="header-container">
    <img src="images/recipe-book.png" alt="recipe book image" id="recipe-book-img">

    <h1 class="header-title">Welcome to the Cookbook</h1>
    
    <div class="spacer"></div>

    <button id="header-search-btn" aria-label="Open Search">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
    </button>

    <a href="index.html" class="profile-link" aria-label="Profile">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon icon-profile" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A7.96 7.96 0 0112 15a7.96 7.96 0 016.879 2.804M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
    </a>
</header>
    <h3>Please search for a recipe or click on a category below.</h3>
    <main>
        <div class="folders">
            <button>
                Appetizers & Snacks
            </button>
            <button>
                Breakfast
            </button>
            <button>
                Desserts
            </button>
            <button>
                Main Dishes
            </button>
            <button>
                Miscellaneous
            </button>
            <button>
                Sauces, Dressings & Marinades
            </button>
            <button>
                Sides, Veggies & Breads
            </button>
            <button>
                Soups & Salads
            </button>
        </div>
        <div id="recent-recipes-box">
    <h3>🕰️ Pick up where you left off:</h3>
    <div id="last-recipe-display">
        <p>No recent history.</p>
    </div>
</div>
<div id="search-overlay" class="hidden-overlay">
    <div class="search-box-content">
        <button id="close-search">✕</button>
        <h3>What are you craving?</h3>
        <form id="search-form">
            <input type="text" id="searchbar" placeholder="Tacos, Pie, etc..." autocomplete="off">
            <button type="submit" id="search-submit">GO</button>
        </form>
    </div>
</div>

<script>
    // 1. Get the single saved item
    const lastRecipe = JSON.parse(localStorage.getItem('lastRecipeSingle'));
    const displayBox = document.getElementById('last-recipe-display');

    if (lastRecipe) {
        // 2. Show it as a big, clickable link
        displayBox.innerHTML = `
            <a href="recipe.html?id=${lastRecipe.id}" class="last-recipe-link">
                ${lastRecipe.name} ➡️
            </a>
        `;
    }
</script>
        <div id ="recipes">    
        </div>
        <p id = "notsigned">
            Please sign in to access the digital cookbook.
        </p>
    </main>
<footer>
</footer>
</body>
</html>
