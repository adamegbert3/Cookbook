<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit a Suggestion</title>
    <link rel="stylesheet" href="styles/recipes.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="offline_features/manifest.json">

    <script>
        const settings = JSON.parse(localStorage.getItem('userSettings'));
        if (settings) {
            const html = document.documentElement;
            if (settings.theme === 'dark') html.setAttribute('data-theme', 'dark');
            const legacySizeMap = { normal: 16, large: 18, xlarge: 20 };
            const fontPx = typeof settings.fontSize === 'number' ? settings.fontSize : (legacySizeMap[settings.fontSize] || 16);
            html.style.setProperty('--base-size', fontPx + 'px');
            html.setAttribute('data-font', settings.fontStyle || 'inter');
        }
    </script>
</head>
<body class="login-page">

    <div class="login-card" style="max-width: 600px; text-align: center;">
        <h1 style="margin-bottom: 10px;">Have a recipe to add?</h1>
        <p class="subtitle" style="margin-bottom: 30px;">We'd love to add it to the family cookbook!</p>
        
        <div style="background: var(--bg-body); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px;">
            <h3 style="margin-top: 0;">Option 1: Send an Email</h3>
            <p style="font-size: 14px; color: var(--primary); opacity: 0.8;">Please include the recipe name, author, ingredients, and instructions.</p>
            <a href="mailto:adamegbert@icloud.com?subject=Cookbook%20Recipe%20Suggestion%20Submission&body=Please%20include%20the%20recipe%20name,%20author,%20ingredients,%20and%20instructions." class="pill-btn btn-teal" style="text-decoration: none; display: inline-block; margin-top: 10px;">
                ✉️ Email Adam
            </a>
        </div>

        <a href="homepage.html" class="pill-btn btn-slate" style="text-decoration: none;">← Back to Cookbook</a>
    </div>

</body>
</html>
