<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping List</title>
    
    <link rel="stylesheet" href="styles/recipes.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="offline_features/manifest.json">

    <script>
        const settings = JSON.parse(localStorage.getItem('userSettings'));
        if (settings) {
            const html = document.documentElement;
            if (settings.theme === 'dark') html.setAttribute('data-theme', 'dark');
            const legacySizeMap = { normal: 16, large: 18, xlarge: 20 };
            const fontPx = typeof settings.fontSize === 'number' ? settings.fontSize : (legacySizeMap[settings.fontSize] || 16);
            html.style.setProperty('--base-size', fontPx + 'px');
            html.setAttribute('data-font', settings.fontStyle || 'inter');
        }
    </script>

    <style>
        body { padding: 20px; max-width: 600px; margin: 0 auto; }
        
        /* The main white/dark box at the top */
        .list-header { 
            background: var(--bg-card); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border); 
            margin-bottom: 20px; 
        }
        
        .add-box { display: flex; gap: 10px; margin-top: 15px; }
        
        .day-group { margin-bottom: 20px; }
        
        /* The text that says "MONDAY", "TUESDAY", etc. */
        .day-title { 
            font-size: 14px; 
            font-weight: 800; 
            color: var(--primary); 
            opacity: 0.7; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
        }
        
        /* Individual ingredient rows */
        .item-row { 
            background: var(--bg-card); 
            padding: 12px; 
            margin-bottom: 8px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            cursor: pointer; 
            border: 1px solid var(--border); 
            color: var(--primary);
        }
        
        /* When an item is crossed off */
        .item-row.checked { 
            opacity: 0.5; 
            background: var(--bg-body); 
            text-decoration: line-through; 
        }
        
        .checkbox { font-size: 18px; }

        /* Style the input box cleanly in both modes */
        #custom-item-input {
            background: var(--input-bg);
            color: var(--primary);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="list-header">
        <h1 style="margin:0; color: var(--accent-teal);">🛒 Shopping List</h1>
        <p style="margin:5px 0 0 0; color: var(--primary); opacity: 0.7; font-size:13px;">Items are saved automatically.</p>
        
        <div class="add-box">
            <input type="text" id="custom-item-input" placeholder="Add milk, eggs, etc..." 
                   style="flex: 1; padding: 10px; border-radius: 8px;">
            <button onclick="addCustomItem()" style="background: var(--accent-teal); color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold;">+</button>
        </div>
    </div>

    <div id="shopping-container">
        <p style="text-align:center; color: var(--primary); opacity: 0.6;">Loading your list...</p>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <a href="homepage.html" class="pill-btn btn-slate" style="text-decoration: none;">← Back to Cookbook</a>
    </div>

    <script type="module">
        import { db, auth } from './scripts/firebase-config.js';
        import { doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
        import { groupIngredients } from './scripts/ingredient-utils.js';

        onAuthStateChanged(auth, user => {
            if (user) {
                loadShoppingList(user.uid);
            } else {
                document.getElementById('shopping-container').innerHTML = "<p style='text-align:center; color: var(--primary);'>Please sign in to see your list.</p>";
            }
        });

        // --- 1. LOAD LIST ---
        function loadShoppingList(uid) {
            const container = document.getElementById('shopping-container');
            
            // Listen to the weekly_plan collection
            onSnapshot(collection(db, "users", uid, "weekly_plan"), (snapshot) => {
                container.innerHTML = "";
                
                // Get checked items first
                getDoc(doc(db, "users", uid, "settings", "shopping_state")).then(stateSnap => {
                    const checkedItems = stateSnap.exists() ? (stateSnap.data().checked || []) : [];

                    if (snapshot.empty) {
                        container.innerHTML = "<p style='text-align:center; color: var(--primary); opacity: 0.6;'>Your meal plan is empty.</p>";
                        return;
                    }

                    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday", "Custom"];
                    const allIngredientEntries = []; // flat list across every day, for the merged view

                    days.forEach(day => {
                        const dayDoc = snapshot.docs.find(d => d.id === day);
                        if (!dayDoc) return; // Skip days with no data

                        let items = [];
                        
                        // --- 1. HANDLE CUSTOM ITEMS ---
                        if (day === "Custom") {
                            const meals = dayDoc.data().meals || [];
                            meals.forEach(m => {
                                // Custom items are stored as "ingredients" inside a fake meal
                                if (m.ingredients && m.ingredients.length > 0) {
                                    items.push({ isIngredient: true, text: m.ingredients[0] });
                                    allIngredientEntries.push({ text: m.ingredients[0], source: 'Extras' });
                                }
                            });
                        }
                        // --- 2. HANDLE REGULAR MEALS ---
                        else {
                            const meals = dayDoc.data().meals || [];
                            meals.forEach(m => {
                                items.push({ isHeader: true, text: `${m.name} (${m.type})` });
                                m.ingredients.forEach(ing => {
                                    items.push({ isIngredient: true, text: ing });
                                    allIngredientEntries.push({ text: ing, source: m.name });
                                });
                            });
                        }

                        // --- 3. RENDER THE GROUP ---
                        if (items.length > 0) {
                            let dayTitle = day === "Custom" ? "📝 My Extras" : day;
                            let dayHtml = `<div class="day-group"><div class="day-title">${dayTitle}</div>`;

                            items.forEach(item => {
                                if (item.isHeader) {
                                    dayHtml += `<div style="font-size:12px; color: var(--accent-teal); font-weight:bold; margin-top:5px; margin-bottom:2px;">${item.text}</div>`;
                                } else {
                                    // Handle ' vs \' in strings for the onclick event
                                    const safeText = item.text.replace(/'/g, "\\'");
                                    const isChecked = checkedItems.includes(item.text);

                                    dayHtml += `
                                        <div class="item-row ${isChecked ? 'checked' : ''}" onclick="toggleCheck('${safeText}', this)">
                                            <span class="checkbox">${isChecked ? '✅' : '⬜'}</span>
                                            <span>${item.text}</span>
                                        </div>`;
                                }
                            });

                            dayHtml += `</div>`;
                            container.innerHTML += dayHtml;
                        }
                    });

                    // --- 4. MERGED VIEW: same ingredient across multiple recipes shown once ---
                    const groups = groupIngredients(allIngredientEntries).filter(g => g.items.length > 1);
                    if (groups.length > 0) {
                        let mergedHtml = `<div class="day-group" style="border: 2px solid var(--accent-teal);">
                            <div class="day-title" style="color: var(--accent-teal);">🔀 Used in Multiple Recipes This Week</div>`;

                        groups.forEach(group => {
                            mergedHtml += `<div style="padding: 8px 0; border-bottom: 1px solid var(--border);">
                                <div style="font-weight: 700; color: var(--primary); text-transform: capitalize;">${group.label || group.items[0].text}</div>`;
                            group.items.forEach(item => {
                                mergedHtml += `<div style="font-size: 13px; color: var(--primary); opacity: 0.8; padding-left: 10px;">• ${item.text} <span style="opacity:0.6;">(${item.source})</span></div>`;
                            });
                            mergedHtml += `</div>`;
                        });

                        mergedHtml += `</div>`;
                        container.innerHTML = mergedHtml + container.innerHTML;
                    }
                });
            });
        }

        // --- 2. TOGGLE CHECKMARK (PERSISTENT) ---
        window.toggleCheck = async function(itemText, element) {
            const user = auth.currentUser;
            if (!user) return;

            // Optimistic UI update (Instant feel)
            const isNowChecked = !element.classList.contains('checked');
            element.classList.toggle('checked');
            element.querySelector('.checkbox').innerText = isNowChecked ? '✅' : '⬜';

            // Save to Firestore
            const stateRef = doc(db, "users", user.uid, "settings", "shopping_state");
            try {
                if (isNowChecked) {
                    await setDoc(stateRef, { checked: arrayUnion(itemText) }, { merge: true });
                } else {
                    await updateDoc(stateRef, { checked: arrayRemove(itemText) });
                }
            } catch (e) { console.error("Save failed", e); }
        }

        // --- 3. ADD CUSTOM ITEM ---
        window.addCustomItem = async function() {
            const input = document.getElementById('custom-item-input');
            const text = input.value.trim();
            if (!text || !auth.currentUser) return;

            // We treat "Custom" as a special day in the database
            const ref = doc(db, "users", auth.currentUser.uid, "weekly_plan", "Custom");
            
            // Add as a "meal" with one ingredient
            const fakeMeal = {
                name: "Personal Items",
                type: "Misc",
                ingredients: [text]
            };

            await setDoc(ref, { meals: arrayUnion(fakeMeal) }, { merge: true });
            input.value = "";
        }
    </script>
</body>
</html>
