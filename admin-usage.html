<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Site Usage | Admin</title>
    <link rel="stylesheet" href="styles/recipes.css">
    <link rel="stylesheet" href="styles/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="offline_features/manifest.json">
    <script>
        const settings = JSON.parse(localStorage.getItem('userSettings'));
        if (settings) {
            const html = document.documentElement;
            if (settings.theme === 'dark') html.setAttribute('data-theme', 'dark');
            const legacySizeMap = { normal: 16, large: 18, xlarge: 20 };
            const fontPx = typeof settings.fontSize === 'number' ? settings.fontSize : (legacySizeMap[settings.fontSize] || 16);
            html.style.setProperty('--base-size', fontPx + 'px');
            html.setAttribute('data-font', settings.fontStyle || 'inter');
        }
    </script>
</head>
<body>

<div class="admin-container">
    <a href="admin.html" class="admin-back-link">← Admin Home</a>
    <h1 style="color: #065f46;">📈 Site Usage</h1>
    <div style="display: flex; gap: 6px; margin-bottom: 10px;">
        <button class="pill-btn usage-range-btn btn-slate active-filter" style="padding: 4px 12px; font-size: 11px;" onclick="setUsageRange('day', this)">Daily</button>
        <button class="pill-btn usage-range-btn btn-slate" style="padding: 4px 12px; font-size: 11px;" onclick="setUsageRange('week', this)">Weekly</button>
        <button class="pill-btn usage-range-btn btn-slate" style="padding: 4px 12px; font-size: 11px;" onclick="setUsageRange('month', this)">Monthly</button>
    </div>
    <p style="font-size: 12px; color: var(--primary); opacity:0.6; margin: 8px 0 15px 0;">A raw count of signed-in visits per day (same person on 2 devices counts twice) — free, no Firebase billing plan needed. For who specifically visited, see Activity.</p>
    <div style="overflow-x: auto; padding-bottom: 4px;">
        <div id="usage-chart" style="display: flex; align-items: flex-end; gap: 8px; min-height: 130px;">
            <p style="color:#9ca3af; font-size: 13px;">Loading usage stats...</p>
        </div>
    </div>
</div>

<script type="module" src="scripts/dashboard.js?v=5"></script>
</body>
</html>
