<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - Cookbook</title>
    <link rel="stylesheet" href="styles/recipes.css?v=11">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="offline_features/manifest.json">
</head>
<body data-page="favorites">
    <div class="header-container">
        <div class="logo-area">
            <div class="header-title">
                <h1>❤️ Favorites</h1>
            </div>
        </div>
        <div class="header-actions">
            <a href="homepage.html" class="pill-btn btn-slate">⬅ Back</a>
        </div>
    </div>

    <main>
        <div style="max-width: 1200px; margin: 0 auto; padding: 20px 0;">
            <div id="favorites-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; align-items: stretch; width: 100%;">
                <p style="color: var(--primary);">Loading your favorites...</p>
            </div>
        </div>
    </main>

    <script type="module" src="scripts/favorites.js"></script>

    <nav class="bottom-nav">
        <a href="homepage.html" class="bottom-nav-item"><span class="bottom-nav-icon">🏠</span><span>Home</span></a>
        <a href="homepage.html?search=1" onclick="handleBottomNavSearch(event)" class="bottom-nav-item"><span class="bottom-nav-icon">🔍</span><span>Search</span></a>
        <a href="submit.html" class="bottom-nav-item bottom-nav-add"><span class="bottom-nav-icon">➕</span></a>
        <a href="#" onclick="openNavMenuModal(event)" class="bottom-nav-item"><span class="bottom-nav-icon">📅</span><span>Menu</span></a>
        <a href="profile.html" class="bottom-nav-item"><span class="bottom-nav-icon bottom-nav-avatar"></span><span>Profile</span></a>
