<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Recipe</title>
    <link rel="stylesheet" href="styles/recipes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body class="login-page">
    <div class="login-card" style="max-width: 700px; text-align: left;">
        <div class="login-header" style="text-align: center;">
            <h1>Contribute a Recipe</h1>
            <p class="subtitle">Share your masterpiece!</p>
        </div>

        <form id="submitForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="input-group">
                    <label>Recipe Title</label>
                    <input type="text" id="title" class="form-input" placeholder="e.g. Grandma's Pie" required>
                </div>
                <div class="input-group">
                    <label>From (Chef)</label>
                    <input type="text" id="chef" class="form-input" placeholder="e.g. Aunt Sally" required>
                </div>
            </div>

            <div class="input-group">
                <label>Ingredients (New line for each)</label>
                <textarea id="ingredients" class="form-input" rows="5" placeholder="2 Cups Flour&#10;1 tsp Salt" required></textarea>
            </div>

            <div class="input-group">
                <label>Instructions (New line for each)</label>
                <textarea id="instructions" class="form-input" rows="5" placeholder="1. Preheat oven...&#10;2. Mix..." required></textarea>
            </div>
            <div class="input-group">
                <label>Category</label>
                <select id="category" class="form-input">
                    <option value="Appetizers & Snacks">Appetizers & Snacks</option>
                    <option value="Breads & Rolls">Breads & Rolls</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Desserts">Desserts</option>
                    <option value="Dutch Oven">Dutch Oven</option>
                    <option value="Main Dishes">Main Dishes</option>
                    <option value="Miscellaneous">Miscellaneous</option>
                    <option value="Sauces, Dressings & Marinades">Sauces, Dressings & Marinades</option>
                    <option value="Soups & Salads">Soups & Salads</option>
                </select>
            </div>

            <div class="input-group">
                <label>Chef's Notes (Optional)</label>
                <textarea id="notes" class="form-input" rows="2" placeholder="Best served warm..."></textarea>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="pill-btn btn-teal" style="flex: 1; justify-content: center;">Submit</button>
                <a href="homepage.html" class="pill-btn btn-slate" style="text-decoration: none;">Cancel</a>
            </div>
        </form>
    </div>
    <script type="module" src="scripts/submit.js"></script>
</body>
</html>
