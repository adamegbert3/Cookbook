<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/recipes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <img src="images/logo.jpg" style="height: 60px; margin-bottom: 10px;" alt="Logo">
            <h1>Welcome Back!</h1>
            <p class="subtitle">Please sign in to access the cookbook.</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <p id="error-message" style="color: red; font-size: 14px; text-align: center; min-height: 20px;"></p>

            <button id="login-btn" type="submit" class="pill-btn btn-teal" style="width: 100%; justify-content: center; margin-top: 10px;">
                Sign In
            </button>
        </form>
    </div>

    <script type="module">
        import { auth } from './scripts/firebase-config.js'; 
        // 🚨 NEW IMPORTS: We are bringing in the Persistence tools!
        import { signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

        const loginForm = document.getElementById('login-form'); 
        const loginBtn = document.getElementById('login-btn'); 
        const emailInput = document.getElementById('email');   
        const passInput = document.getElementById('password'); 
        const errorMsg = document.getElementById('error-message');

        // 1. AUTO-REDIRECT
        onAuthStateChanged(auth, user => {
            if (user && !loginBtn.disabled) {
                window.location.href = "homepage.html"; 
            }
        });

        // 2. BULLETPROOF LOGIN
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); 
                
                const email = emailInput.value.trim();
                const password = passInput.value;
                
                if(errorMsg) errorMsg.innerText = "";

                const originalText = loginBtn.innerText;
                loginBtn.innerText = "Signing in...";
                loginBtn.disabled = true;

                try {
                    // 🚨 NEW: Force the browser to remember this login permanently!
                    await setPersistence(auth, browserLocalPersistence);
                    
                    // Perform Login
                    await signInWithEmailAndPassword(auth, email, password);
                    
                    loginBtn.innerText = "Redirecting...";
                    window.location.href = "homepage.html"; 

                } catch (error) {
                    console.error("❌ Login Failed:", error);
                    let message = "Login Failed: " + error.message;
                    
                    if(error.code === "auth/user-not-found" || error.code === "auth/invalid-credential" || error.code === "auth/wrong-password") {
                        message = "Account not found or incorrect password.";
                    } else if (error.code === "auth/network-request-failed") {
                        message = "Network error. Please check your Wi-Fi/Data.";
                    }

                    if(errorMsg) errorMsg.innerText = message;
                    
                    // Unlock Button so it never gets stuck!
                    loginBtn.innerText = originalText;
                    loginBtn.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
