<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookbook Login</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configure Tailwind for custom theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-green': '#10B981', // Emerald 500
                        'secondary-orange': '#F59E0B', // Amber 500
                        'dark-bg': '#1F2937', // Gray 800
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Apply smooth transitions to interactive elements */
        .form-input {
            transition: all 0.3s ease;
        }
        .form-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.4); /* Emerald/Primary-Green focus ring */
            border-color: #10B981;
        }
        /* Style the background for a warm kitchen feel */
        body {
            background: linear-gradient(135deg, #F9FAFB 0%, #F3F4F6 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="font-sans flex items-center justify-center p-4">

    <!-- Login Container Card -->
    <div class="w-full max-w-sm bg-white p-8 md:p-10 shadow-2xl rounded-xl border border-gray-100 transform transition duration-500 hover:shadow-3xl">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <!-- Cookbook Icon/Logo Placeholder (Using an emoji for quick visual identity) -->
            <p class="text-6xl mb-2">🍽️</p>
            <h1 class="text-3xl font-bold text-gray-800">Welcome Back, Chef!</h1>
            <p class="text-sm text-gray-500 mt-1">Sign in to access your digital cookbook.</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
            
            <!-- Email/Username Input -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="you@example.com"
                    required 
                    class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green"
                >
            </div>

            <!-- Password Input -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••"
                    required 
                    class="form-input w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-primary-green focus:border-primary-green"
                >
            </div>

            <!-- Forgot Password Link -->
            <div class="flex justify-end text-sm">
                <a href="#" class="font-medium text-primary-green hover:text-secondary-orange transition duration-200" onclick="alertPlaceholder('Forgot Password clicked!')">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button 
                type="submit" 
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-sm font-semibold text-white bg-primary-green hover:bg-emerald-600 focus:outline-none focus:ring-4 focus:ring-primary-green focus:ring-opacity-50 transition duration-300 transform active:scale-95"
            >
                Log In
            </button>

        </form>
        
        <!-- Sign Up Prompt -->
        <p class="mt-8 text-center text-sm text-gray-600">
            Don't have an account? 
            <a href="#" class="font-medium text-secondary-orange hover:text-primary-green transition duration-200" onclick="alertPlaceholder('Sign Up clicked!')">
                Create Account
            </a>
        </p>

    </div>

    <!-- Custom Modal/Message Box for alerts (Since alert() is forbidden) -->
    <div id="messageBox" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">Message</h3>
            <p id="messageText" class="text-gray-600 mb-6"></p>
            <button onclick="hideMessageBox()" class="w-full py-2 bg-primary-green text-white rounded-lg hover:bg-emerald-600 transition">
                OK
            </button>
        </div>
    </div>

    <script>
        // Placeholder function for custom message box (instead of alert())
        function alertPlaceholder(message) {
            document.getElementById('messageText').textContent = message;
            document.getElementById('messageBox').classList.remove('hidden');
            document.getElementById('messageBox').classList.add('flex');
        }

        function hideMessageBox() {
            document.getElementById('messageBox').classList.add('hidden');
            document.getElementById('messageBox').classList.remove('flex');
        }

        // JavaScript to handle form submission
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission (page reload)

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Log data for demonstration (replace this with your actual authentication logic)
            console.log('Login attempt with:');
            console.log('Email:', email);
            console.log('Password:', password);
            
            // Show a success/placeholder message
            alertPlaceholder("Login simulated! Check the console for input data. Ready to connect to a real backend!");

            // In a real app, you would fetch('your-auth-endpoint', { method: 'POST', body: JSON.stringify({ email, password }) }) here.
        });
    </script>
</body>
</html>
