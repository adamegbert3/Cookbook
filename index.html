<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/recipes.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link rel="manifest" href="offline_features/manifest.json">
    <!-- Start connecting to Firebase early so sign-in has less network latency to pay for -->
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <img src="images/logo.jpg" style="height: 60px; margin-bottom: 10px;" alt="Logo">
            <h1>Welcome Back!</h1>
            <p class="subtitle">Please sign in to access the cookbook.</p>
        </div>

        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            
            <p id="error-message" style="color: red; font-size: 14px; text-align: center; min-height: 20px;"></p>

            <button id="login-btn" type="submit" class="pill-btn btn-teal" style="width: 100%; justify-content: center; margin-top: 10px;">
                Sign In
            </button>
        </form>

        <p style="margin: 15px 0 0 0;">
            <button type="button" id="forgot-btn" style="background:none; border:none; padding:0; color:var(--accent-teal); font-weight:600; font-size:0.9rem; font-family:var(--font-main); cursor:pointer; text-decoration:underline;">
                Forgot your password?
            </button>
        </p>
        <p id="reset-message" style="font-size:13px; margin:10px 0 0 0; min-height:18px;"></p>

        <hr style="border: 0; border-top: 1px solid var(--border); margin: 25px 0 15px 0;">

        <p style="font-size: 13px; color: #64748b; margin: 0;">
            First time here?
            <a href="invite.html" class="auth-link">Set up your account with your invite code →</a>
        </p>
    </div>

    <script type="module">
        import { auth } from './scripts/firebase-config.js'; 
        // 🚨 NEW IMPORTS: We are bringing in the Persistence tools!
        import { signInWithEmailAndPassword, onAuthStateChanged, setPersistence, browserLocalPersistence, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const emailInput = document.getElementById('email');
        const passInput = document.getElementById('password');
        const errorMsg = document.getElementById('error-message');
        const originalBtnText = loginBtn.innerText;

        // Never let a slow/flaky connection leave the button stuck forever —
        // race the real request against a timeout so the user always gets
        // either a redirect or a retry-able error within a few seconds.
        function withTimeout(promise, ms, timeoutMessage) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(Object.assign(new Error(timeoutMessage), { code: 'timeout' })), ms))
            ]);
        }

        let loginAttempt = 0;

        function resetLoginButton() {
            loginBtn.innerText = originalBtnText;
            loginBtn.disabled = false;
        }

        // 1. AUTO-REDIRECT (for already-logged-in sessions restored on page load)
        onAuthStateChanged(auth, user => {
            if (user && !loginBtn.disabled) {
                window.location.href = "homepage.html";
            }
        });

        // 1b. FORGOT PASSWORD
        // Firebase emails a one-time reset link using the "Password reset"
        // template configured under Authentication → Templates. Nothing here
        // ever sees or sets a password, and we deliberately give the same
        // confirmation whether or not the address has an account, so this
        // can't be used to discover who's in the cookbook.
        const forgotBtn = document.getElementById('forgot-btn');
        const resetMsg = document.getElementById('reset-message');

        if (forgotBtn) {
            forgotBtn.addEventListener('click', async () => {
                const email = emailInput.value.trim();

                if (!email) {
                    resetMsg.style.color = '#b45309';
                    resetMsg.innerText = "Type your email address above first, then tap this again.";
                    emailInput.focus();
                    return;
                }

                forgotBtn.disabled = true;
                resetMsg.style.color = '#64748b';
                resetMsg.innerText = "Sending...";

                try {
                    await withTimeout(sendPasswordResetEmail(auth, email), 15000, "That's taking too long — try again.");
                    console.log("📧 [RESET] Password reset email requested for:", email);
                } catch (error) {
                    // auth/user-not-found is swallowed on purpose (see above).
                    if (error.code !== 'auth/user-not-found' && error.code !== 'auth/invalid-email') {
                        console.error("🔥 [RESET] Failed:", error);
                        resetMsg.style.color = '#ef4444';
                        resetMsg.innerText = "Couldn't send that — check your connection and try again.";
                        forgotBtn.disabled = false;
                        return;
                    }
                    if (error.code === 'auth/invalid-email') {
                        resetMsg.style.color = '#b45309';
                        resetMsg.innerText = "That doesn't look like a valid email address.";
                        forgotBtn.disabled = false;
                        return;
                    }
                }

                resetMsg.style.color = '#0d9488';
                resetMsg.innerText = `📧 If ${email} has an account, a reset link is on its way. Check spam if you don't see it.`;
                forgotBtn.disabled = false;
            });
        }

        // 2. BULLETPROOF LOGIN (with a timeout so it can never hang forever)
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passInput.value;
                const thisAttempt = ++loginAttempt;

                if(errorMsg) errorMsg.innerText = "";

                loginBtn.innerText = "Signing in...";
                loginBtn.disabled = true;

                try {
                    await withTimeout(setPersistence(auth, browserLocalPersistence), 15000, "Connection is slow. Please try again.");

                    // Perform Login
                    await withTimeout(signInWithEmailAndPassword(auth, email, password), 15000, "That's taking too long — check your connection and try again.");

                    // A newer attempt already took over (rare double-submit race) — let it finish instead.
                    if (thisAttempt !== loginAttempt) return;

                    loginBtn.innerText = "Redirecting...";
                    window.location.href = "homepage.html";

                } catch (error) {
                    if (thisAttempt !== loginAttempt) return;

                    console.error("❌ Login Failed:", error);
                    let message = "Login Failed: " + error.message;

                    if(error.code === "auth/user-not-found" || error.code === "auth/invalid-credential" || error.code === "auth/wrong-password") {
                        message = "Account not found or incorrect password.";
                    } else if (error.code === "auth/network-request-failed" || error.code === "timeout") {
                        message = "Connection trouble — please check your Wi-Fi/data and tap Sign In again.";
                    }

                    if(errorMsg) errorMsg.innerText = message;

                    // Unlock Button so it never gets stuck!
                    resetLoginButton();
                }
            });
        }
    </script>
</body>
</html>
