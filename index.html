<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookbook Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/recipes.css">
</head>
<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div class="logo-icon">🍽️</div>
            <h1>Welcome Back,<br>Chef!</h1>
            <p class="subtitle">Sign in to access your digital cookbook.</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>

            <div class="forgot-link">
                <a href="#" onclick="sendReset()">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="#" onclick="showSignUp()">Create Account</a>
        </div>
    </div>

    <div id="messageBox" class="modal hidden">
        <div class="modal-content">
            <p id="messageText"></p>
            <button onclick="hideMessageBox()" class="modal-btn">OK</button>
        </div>
    </div>

    <script src="./scripts/login.js" type="module"></script>
</body>
</html>
