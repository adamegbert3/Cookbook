<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Recipe | Family Cookbook</title>
    <link rel="stylesheet" href="styles/recipes.css?v=4">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <script>
        const settings = JSON.parse(localStorage.getItem('userSettings'));
        if (settings) {
            const html = document.documentElement;
            if (settings.theme === 'dark') html.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>

    <div class="header-container no-print">
        <div class="logo-area">
            <img src="images/logo.jpg" alt="Logo" class="logo-img">
            <div class="header-title">
                <h1>Family Cookbook</h1>
            </div>
        </div>
        <div class="header-actions">
            <button id="share-print-btn" class="pill-btn btn-slate" style="display:none;">🖨️ Print</button>
        </div>
    </div>

    <main>
        <p id="share-status" style="text-align:center; color: var(--primary); opacity: 0.8; max-width: 420px; margin: 40px auto;">Loading recipe...</p>
        <div id="share-recipe" style="display:none; max-width: 700px; margin: 0 auto;"></div>
    </main>

    <div class="no-print" style="text-align: center; margin-top: 30px;">
        <p style="color: #64748b; font-size: 13px;">Shared from a family recipe collection.</p>
        <a href="terms.html" style="color: #64748b; font-size: 13px; text-decoration: underline;">Terms of Use & Privacy Policy</a>
    </div>

    <script type="module" src="scripts/share.js"></script>
</body>
</html>
